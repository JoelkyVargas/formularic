cat > ops/nginx.conf << 'EOF'
events {}
http {
  server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    location /static/ {
      alias /app/static/;
    }

    location /media/ {
      alias /app/media/;
    }

    location / {
      proxy_pass http://web:8000;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Host $host;
    }
  }
}
EOF
