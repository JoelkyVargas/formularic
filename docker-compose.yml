cat > docker-compose.yml << 'EOF'
version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: formularic
      POSTGRES_USER: formularic
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U formularic"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  # nginx (opcional; usar en prod con TLS)
  nginx:
    image: nginx:stable
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./ops/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
EOF
